name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn workspace @hitly/mail test
      - run: yarn typecheck
      - run: yarn build
        env:
          BETTER_AUTH_SECRET: ci-only-change-me-please-32ch
          BETTER_AUTH_URL: http://localhost:3001
          DATABASE_URL: postgres://hitly:hitly@localhost:5432/hitly
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          WEB_URL: http://localhost:3000
