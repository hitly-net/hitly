# Self-hosted HITLy collects no telemetry or usage data by default.
# HITLY_TELEMETRY unset → Next CLI telemetry off (scripts/with-hitly-telemetry.sh
# sets NEXT_TELEMETRY_DISABLED=1). Use the same wrapper in Dockerfile build and
# runtime stages. HITLY_TELEMETRY=1 or true enables Next telemetry and, on
# apps/web, Plausible (domain/src still from env; never hardcoded).
x-hitly-telemetry:
  HITLY_TELEMETRY: ${HITLY_TELEMETRY:-}

services:
  db:
    image: postgres:16
    container_name: hitly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hitly
      POSTGRES_USER: hitly
      POSTGRES_PASSWORD: hitly
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hitly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hitly -d hitly']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  hitly_postgres:
