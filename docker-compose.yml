# Compose only runs Postgres. HITLy Next/Turbo processes are started by yarn /
# systemd via scripts/with-hitly-telemetry.sh (HITLY_TELEMETRY unset →
# NEXT_TELEMETRY_DISABLED=1 and TURBO_TELEMETRY_DISABLED=1).
services:
  db:
    image: postgres:16
    container_name: hitly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hitly
      POSTGRES_USER: hitly
      POSTGRES_PASSWORD: hitly
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hitly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hitly -d hitly']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  hitly_postgres:
